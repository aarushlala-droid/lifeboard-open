<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeBoard">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Your To Dos, today's plan and Focus, with your Mac.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
  <title>LifeBoard</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="navbar" id="topbar">
      <div class="nav-leading" id="nav-leading"></div>
      <div class="nav-title" id="nav-title" aria-hidden="true"></div>
      <div class="nav-trailing">
        <button id="add-button" class="icon-button" type="button" aria-label="Add To Do" data-action="manual-add" data-icon="plus"></button>
      </div>
    </header>
    <main id="screen" tabindex="-1" aria-live="off"></main>
    <p id="sync-status" class="sync-footer" role="status">Connecting</p>
    <nav id="tabbar" class="tabbar" aria-label="Main navigation">
      <div class="tab-group">
        <button type="button" data-tab="today"><span class="tab-icon" data-icon="today"></span><span class="tab-label">Today</span></button>
        <button type="button" data-tab="todo"><span class="tab-icon" data-icon="todo"></span><span class="tab-label">To Do</span></button>
        <button type="button" data-tab="calendar"><span class="tab-icon" data-icon="calendar"></span><span class="tab-label">Calendar</span></button>
        <button type="button" data-tab="more"><span class="tab-icon" data-icon="browse"></span><span class="tab-label">Browse</span></button>
      </div>
      <button id="search-button" class="tab-search" type="button" data-tab="search" aria-label="Search" data-icon="search"></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <noscript><p class="noscript">LifeBoard needs JavaScript to open your planner on this device.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
