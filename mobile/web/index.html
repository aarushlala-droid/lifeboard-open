<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeBoard">
  <meta name="description" content="Your To Dos, today and focus in one calm place.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="stylesheet" href="/app.css">
  <title>LifeBoard</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand"><img class="brand-mark" src="/icon-192.png" alt="" width="36" height="36"><span>LifeBoard</span></div>
      <button id="search-button" class="icon-button" type="button" aria-label="Search LifeBoard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button>
    </header>
    <div id="sync-status" class="sync-status" role="status">Connecting…</div>
    <main id="screen" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main navigation">
      <button type="button" data-tab="today"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></span><span>Today</span></button>
      <button type="button" data-tab="todo"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m7 9 1.5 1.5L11 8m2 1h4M7 15h3m3 0h4"/></svg></span><span>To Do</span></button>
      <button type="button" data-tab="capture" class="capture-tab"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>Capture</span></button>
      <button type="button" data-tab="calendar"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2"/></svg></span><span>Calendar</span></button>
      <button type="button" data-tab="more"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span><span>More</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
